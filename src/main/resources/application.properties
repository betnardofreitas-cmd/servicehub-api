spring.application.name=servicehub-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${DB_USERNAME:servicehub}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---- Seguranca / JWT (fase 2) ----
# Em producao, defina JWT_SECRET com pelo menos 32 caracteres (256 bits para HS256)
jwt.secret=${JWT_SECRET:c2VydmljZWh1Yi1kZXYtc2VjcmV0LWtleS1hdC1sZWFzdC0yNTYtYml0cw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Usuario ADMIN criado na inicializacao (DataInitializer) se ainda nao existir
app.admin.email=${ADMIN_EMAIL:admin@servicehub.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---- GraphQL (endpoint alternativo) ----
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
