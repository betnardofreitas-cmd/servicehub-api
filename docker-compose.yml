services:
  postgres:
    image: postgres:16
    container_name: servicehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - servicehub_data:/var/lib/postgresql/data

volumes:
  servicehub_data:
